name: TLKit
options:
  bundleIdPrefix: me.ckai
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_LANGUAGE: en
    ARCHS: "arm64 x86_64"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${TLKIT_TEAM_ID}
    PRODUCT_BUNDLE_IDENTIFIER: me.ckai.translate
    INFOPLIST_FILE: Sources/TLKit/Resources/Info.plist
    GENERATE_INFOPLIST_FILE: false
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # K1 修复：Xcode 26 的 actool 默认丢弃 .appiconset 位图、换成自动生成的
    # icon stack（macOS 14 的 CoreUI 解析不了 → 图标回退成方块、菜单栏图标 nil）。
    # 这两个开关强制 actool 把真实位图编进 Assets.car，并生成全尺寸 .icns 兜底。
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APP_ICONS: YES
    ASSETCATALOG_OTHER_FLAGS: "--enable-icon-stack-fallback-generation=disabled"
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  configs:
    Debug:
      ENABLE_HARDENED_RUNTIME: false
    Release:
      ENABLE_HARDENED_RUNTIME: true
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application: $(TLKIT_SIGNING_NAME) ($(TLKIT_TEAM_ID))"
      # 直装版（Developer ID 分发）不含沙盒：CGEvent 事件投递（模拟 ⌘C）需要。
      # App Store 构建由 build-appstore.sh 通过 CODE_SIGN_ENTITLEMENTS 覆盖为含沙盒的 TLKit.entitlements，
      # 并追加 SWIFT_ACTIVE_COMPILATION_CONDITIONS=APP_STORE 编译宏。
      CODE_SIGN_ENTITLEMENTS: Sources/TLKit/Resources/TLKit-Direct.entitlements
      OTHER_CODE_SIGN_FLAGS: "--timestamp --options=runtime"
targets:
  TLKit:
    type: application
    platform: macOS
    sources:
      - path: Sources/TLKit
        excludes:
          - "Resources/Info.plist"
          - "Resources/*.entitlements"
          # 图标主图源文件（scripts/generate-icon.sh 的输入），不进 App bundle
          - "Resources/AppIcon-1024.png"
          # macOS 14 兜底 icns 的原料，由下方 postBuild 脚本显式拷贝，不走资源拷贝
          - "Resources/AppIcon-Legacy.icns"
    # K1：actool 产出的 AppIcon.icns 只有 16/128 两档且 macOS 14 读不了 Assets.car，
    # 用手工烘焙的全尺寸圆角 icns 覆盖。脚本阶段先于签名执行，覆盖物会被正常签进 bundle。
    postBuildScripts:
      - name: "Override legacy AppIcon.icns"
        script: |
          cp "${SRCROOT}/Sources/TLKit/Resources/AppIcon-Legacy.icns" \
             "${TARGET_BUILD_DIR}/${PRODUCT_NAME}.app/Contents/Resources/AppIcon.icns"
    settings:
      base:
        PRODUCT_NAME: TLKit
  TLKitTests:
    type: bundle.unit-test
    platform: macOS
    # 纯逻辑单测：把被测文件直接编进测试目标，
    # 不挂 app 宿主，避免 SwiftUI @main 与 XCTest 重复创建 NSApplication。
    sources:
      - path: Tests/TLKitTests
      - path: Sources/TLKit/Translation/BaiduTranslator.swift
      - path: Sources/TLKit/Translation/TranslationService.swift
      - path: Sources/TLKit/Translation/OpenAICompatibleTranslator.swift
      - path: Sources/TLKit/Translation/SystemTranslator.swift
      - path: Sources/TLKit/Support/LanguageCatalog.swift
      - path: Sources/TLKit/History/HistoryStore.swift
      - path: Sources/TLKit/Support/ConfigStore.swift
      - path: Sources/TLKit/Support/AppearanceManager.swift
      - path: Sources/TLKit/Support/KeychainStore.swift
      - path: Sources/TLKit/Support/TLKitLocalization.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.ckai.TLKitTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: ""
schemes:
  TLKit:
    build:
      targets:
        TLKit: all
    test:
      targets:
        - TLKitTests
